<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamp Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="lampSide">
            <div class="lampContainer" id="lampContainer">
                <div class="lampShade"></div>
                <div class="lampPole"></div>
                <div class="lampBase"></div>

                <div class="pullRope" id="pullRope"></div>
                <div class="ropeHandle" id="ropeHandle"></div>
            </div>
        </div>

    <div class="loginSide">
        <div class="loginForm" id="loginForm">
            <h2>WELCOME</h2>
            <input type="text" placeholder="Username">
            <input type="text" placeholder="Password">

            <button class="signinButton">Sign-in</button>
            </div>
        </div>
    </div>
        

    <script src="script.js"></script>

    
</body>
</html>
